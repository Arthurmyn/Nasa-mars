<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redline — Mars Trips</title>
    <meta name="description" content="Book your seat to Mars. A three-step interactive 3D journey from Mars orbit to Tharsis and canyon landing sites." />
    <meta property="og:title" content="Redline — Mars Trips" />
    <meta property="og:description" content="Book your seat to Mars. A three-step interactive 3D journey from Mars orbit to Tharsis and canyon landing sites." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800;900&display=swap" />
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
    <style>
      :root{--red:#e8283c;--deep:#2a0d04}
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;overflow:hidden;background:var(--deep);color:#fff;font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
      .hero{position:fixed;inset:0;overflow:hidden;background:radial-gradient(58% 72% at 50% 47%,#d0591f 0%,#a23f12 32%,#6b2409 62%,#3b1405 100%)}
      .hero>*{position:absolute}

      #word0{left:50%;top:50%;font-weight:900;font-size:min(27vw,50vh);line-height:.8;letter-spacing:-.035em;white-space:nowrap;z-index:2;will-change:transform,clip-path}
      #eyebrow{left:50%;top:50%;z-index:3;font-weight:300;font-size:clamp(14px,1.45vw,23px);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
      #gl{inset:0;width:100%;height:100%;z-index:4;cursor:grab;touch-action:none}
      #gl.drag{cursor:grabbing}
      #dust{inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
      #flare{z-index:1;width:44vmin;height:44vmin;margin:-22vmin;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,236,205,.95),rgba(255,176,96,.42) 26%,rgba(255,140,60,.1) 58%,transparent)}

      #pin{z-index:6;left:0;top:0;display:flex;align-items:center;gap:9px;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
      #pin i{width:12px;height:12px;border-radius:50%;background:#fff;position:relative;box-shadow:0 0 0 4px rgba(232,40,60,.75)}
      #pin i::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1px solid #fff;animation:pulse 2s ease-out infinite}
      @keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}

      #word1{left:50%;top:0;z-index:6;font-weight:800;font-size:min(9.4vw,19vh);letter-spacing:-.02em;line-height:1;color:rgba(255,255,255,.74);pointer-events:none;white-space:nowrap}

      #sites{right:6.2%;top:50%;z-index:7;list-style:none;display:grid;gap:clamp(30px,6.6vh,62px);transform:translateY(-50%)}
      #sites::before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.5)}
      #sites li{position:relative;text-align:right;padding-right:30px;cursor:pointer;font-weight:500;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;transition:font-size .3s}
      #sites li::after{content:"";position:absolute;right:1px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:#fff;transition:transform .3s,box-shadow .3s}
      #sites li.on{font-size:15px}
      #sites li.on::after{transform:scale(1.5);box-shadow:0 0 0 7px rgba(255,255,255,.28)}
      #card{right:calc(6.2% + 196px);top:0;z-index:7;width:clamp(170px,15.5vw,250px);aspect-ratio:1.42;background-repeat:no-repeat;border-radius:3px;box-shadow:0 22px 44px rgba(20,4,0,.45);overflow:visible}
      #card a{position:absolute;left:-26px;bottom:18%;background:var(--red);font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:9px 15px;border-radius:2px;box-shadow:0 8px 18px rgba(120,10,20,.45)}

      #region{left:50%;top:50%;z-index:7;transform:translate(-50%,-50%);font-weight:500;font-size:clamp(26px,3.4vw,54px);letter-spacing:.04em;pointer-events:none}

      #land,#fore{inset:0;background-size:cover;background-repeat:no-repeat}
      #land{z-index:8;background-position:50% 60%;will-change:transform}
      #dest{left:0;right:0;top:0;z-index:9;text-align:center;pointer-events:none}
      #dest small{display:block;font-weight:300;font-size:min(5.2vw,11vh);line-height:1;letter-spacing:.04em;text-transform:uppercase;opacity:.92}
      #dest b{display:block;margin-top:.04em;font-weight:900;font-size:min(9.2vw,19vh);line-height:1;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap;color:#fff4e6}
      #fore{z-index:10;background-position:50% 100%;will-change:transform}
      #fog{inset:0;z-index:11;pointer-events:none;background:radial-gradient(70% 64% at 50% 46%,#fbe6cd 0%,#f6d3ae 52%,#b36a37 100%)}

      #scrim{left:0;right:0;top:0;height:150px;z-index:13;pointer-events:none;background:linear-gradient(rgba(44,14,3,.62),rgba(44,14,3,0))}
      #bar{left:50%;bottom:7.5vh;z-index:12;width:min(86vw,920px);display:grid;grid-template-columns:1fr 1fr 1fr 68px;background:#fff;color:#2b1a12;border-radius:3px;box-shadow:0 24px 60px rgba(30,6,0,.5)}
      #bar div{padding:15px 22px;border-right:1px solid #eadfd6}
      #bar label{display:block;font-weight:500;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9a877b}
      #bar input{width:100%;margin-top:5px;border:0;outline:0;font:600 15px Montserrat,sans-serif;color:#2b1a12;background:none}
      #bar button{background:var(--red);color:#fff;border-radius:0 3px 3px 0;font-size:22px;transition:background .25s}
      #bar button:hover{background:#c41426}

      /* chrome */
      header{left:0;right:0;top:0;z-index:20;display:flex;align-items:center;padding:clamp(18px,3.2vh,30px) clamp(20px,2.6vw,42px);font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;pointer-events:none}
      header>*{pointer-events:auto}
      .logo{display:flex;align-items:center;gap:12px;margin-right:auto;font-weight:800;font-size:19px;letter-spacing:-.01em;text-transform:none}
      .logo svg{width:34px;height:30px}
      header a{margin-left:clamp(16px,2.6vw,38px);opacity:.92;transition:opacity .2s}
      header a:hover{opacity:1}
      .ico{width:42px;height:42px;margin-left:clamp(14px,2.4vw,36px);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);transition:background .25s}
      .ico:hover{background:rgba(255,255,255,.34)}
      .ico svg,.srch svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
      .srch{margin-left:clamp(16px,2.6vw,38px)}
      #rail{left:clamp(20px,2.6vw,42px);top:50%;z-index:20;display:grid;gap:15px;transform:translateY(-50%)}
      #rail button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .3s,transform .3s}
      #rail button.on{background:#fff;transform:scale(1.35)}
      #hint{left:50%;bottom:4.4vh;transform:translateX(-50%);z-index:7;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:uppercase;opacity:.8;white-space:nowrap}

      @media (max-width:760px){
        header a{display:none}
        #word0{font-size:29vw}
        #eyebrow{font-size:12px}
        #word1{font-size:15vw}
        #sites{right:18px;top:auto;bottom:11vh;transform:none;gap:22px}
        #card{right:auto;left:18px;top:auto!important;bottom:11vh;width:42vw}
        #card a{left:8px;bottom:8px}
        #dest b{font-size:11vw}#dest small{font-size:7vw}
        #bar{grid-template-columns:1fr 1fr;width:calc(100vw - 32px);bottom:4vh}
        #bar div:nth-child(2){border-right:0}
        #bar div{padding:11px 14px;border-bottom:1px solid #eadfd6}
        #bar button{height:46px;border-radius:0 0 3px 0}
        #hint,#rail{display:none}
        #fore{background-size:210% auto}
      }
    </style>
  </head>
  <body>
    <main class="hero" id="hero">
      <div id="word0">MARS</div>
      <div id="eyebrow">Book your seat to</div>
      <div id="flare"></div>
      <canvas id="gl"></canvas>
      <canvas id="dust"></canvas>
      <div id="pin"><i></i><span>Tharsis</span></div>
      <div id="word1">THARSIS</div>
      <ul id="sites"></ul>
      <div id="card"><a href="#" id="explore">Explore</a></div>
      <div id="region">THARSIS</div>
      <div id="land"></div>
      <div id="dest"><small>Tharsis</small><b id="destName">Olympus Mons</b></div>
      <div id="fore"></div>
      <div id="fog"></div>
      <div id="scrim"></div>
      <form id="bar" onsubmit="return false">
        <div><label for="d1">Depart Earth</label><input id="d1" value="12 Mar 2041"></div>
        <div><label for="d2">Return</label><input id="d2" value="30 Sep 2042"></div>
        <div><label for="d3">Passengers</label><input id="d3" value="2 adults"></div>
        <button aria-label="Search seats">→</button>
      </form>
      <header>
        <a class="logo" href="#" id="home" style="margin-left:0;opacity:1"><svg viewBox="0 0 34 30" fill="none" stroke="#fff" stroke-linecap="round"><path stroke-width="3.2" d="M3 27C5 13 15 4 31 3"/><path stroke-width="2" d="M11 27c1.500-8 8-14 18-15"/><circle cx="30" cy="20" r="3.500" fill="#fff" stroke="none"/></svg>Redline</a>
        <a href="#">Login</a><a href="#">Sign up</a>
        <span class="srch"><svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6.500"/><path d="m15.500 15.500 5 5"/></svg></span>
        <button class="ico" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 8h14M7 12h10M5 16h14"/></svg></button>
      </header>
      <div id="rail"><button aria-label="Mars"></button><button aria-label="Tharsis"></button><button aria-label="Destination"></button></div>
      <div id="hint">Drag to spin · click the planet to land</div>
    </main>

    <script type="module">
      import * as THREE from 'three';

      const P = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_';
      const MAP = P + '20261031_030432_a1948696-c1d5-4468-845e-7d1291f80943.png&w=2688&q=92';
      const LAND = P + '20261031_030420_da39d0cf-af67-4e33-a487-6469549cfbff.png&w=2400&q=88';
      const FORE = P + '20261031_030420_fe406b69-3e6f-4b7c-a17e-ef09db0d270b.png&w=2400&q=88';
      const CARDS = P + '20261031_030420_e222aa05-c121-4f31-a466-0321badc0e28.png&w=1400&q=85';

      const SHEET = {w: 2336, h: 1744};
      const SITES = [
        {name: 'Olympus Mons', u: .121, v: .31, box: [0, 0, 1150, 810]},
        {name: 'Valles Marineris', u: .45, v: .56, box: [1186, 0, 1150, 810]},
        {name: 'Gale Crater', u: .85, v: .75, box: [0, 900, 1150, 810]},
        {name: 'Jezero Delta', u: .61, v: .35, box: [1186, 900, 1150, 810]}
      ];
      const THARSIS = {u: .15, v: .41};

      const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
      const mix = (a, b, t) => a + (b - a) * t;
      const seg = (p, a, b) => clamp((p - a) / (b - a));
      const io = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      const out = (k) => 1 - Math.pow(1 - k, 3);

      function dir(u, v) {
        const ph = Math.PI * 2 * u;
        const th = Math.PI * v;
        return new THREE.Vector3(-Math.cos(ph) * Math.sin(th), Math.cos(th), Math.sin(ph) * Math.sin(th));
      }
      const faceYaw = (d) => Math.atan2(-d.x, d.z);
      const faceLat = (d) => Math.asin(clamp(d.y, -1, 1));

      // DOM refs
      const $ = (id) => document.getElementById(id);
      const word0 = $('word0');
      const eyebrow = $('eyebrow');
      const flare = $('flare');
      const glCanvas = $('gl');
      const dustCanvas = $('dust');
      const pin = $('pin');
      const word1 = $('word1');
      const sitesEl = $('sites');
      const card = $('card');
      const explore = $('explore');
      const region = $('region');
      const land = $('land');
      const dest = $('dest');
      const destSmall = dest.querySelector('small');
      const destName = $('destName');
      const fore = $('fore');
      const fog = $('fog');
      const scrim = $('scrim');
      const bar = $('bar');
      const barBtn = bar.querySelector('button');
      const home = $('home');
      const railBtns = [...$('rail').querySelectorAll('button')];
      const hint = $('hint');

      // Background images & preloading
      land.style.backgroundImage = `url("${LAND}")`;
      fore.style.backgroundImage = `url("${FORE}")`;
      card.style.backgroundImage = `url("${CARDS}")`;
      [LAND, FORE, CARDS].forEach((src) => { const im = new Image(); im.src = src; });

      // Sites list + card picker
      let cur = 0;
      sitesEl.innerHTML = SITES.map((s, i) => `<li data-i="${i}">${s.name}</li>`).join('');
      const siteItems = [...sitesEl.querySelectorAll('li')];

      function alignCard(i) {
        const li = siteItems[i];
        if (!li) return;
        const rect = li.getBoundingClientRect();
        if (rect.height > 0) {
          card.style.top = (rect.top + rect.height / 2 - card.offsetHeight / 2) + 'px';
        }
      }

      function pick(i) {
        cur = i;
        siteItems.forEach((el, idx) => el.classList.toggle('on', idx === i));
        const [x, y, w, h] = SITES[i].box;
        card.style.backgroundSize = `${(SHEET.w / w) * 100}% ${(SHEET.h / h) * 100}%`;
        card.style.backgroundPosition = `${(x / (SHEET.w - w)) * 100}% ${(y / (SHEET.h - h)) * 100}%`;
        destName.textContent = SITES[i].name;
        region.textContent = SITES[i].name.toUpperCase();
        requestAnimationFrame(() => alignCard(i));
      }

      siteItems.forEach((li, i) => {
        li.addEventListener('pointerenter', () => pick(i));
        li.addEventListener('click', () => { pick(i); go(2); });
      });

      // State transitions
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let st = 0, from = 0, to = 0, t0 = 0, dur = 0;

      function go(n) {
        n = clamp(Math.round(n), 0, 2);
        if (n === to) return;
        from = st;
        to = n;
        t0 = performance.now();
        const lo = Math.min(from, to), hi = Math.max(from, to);
        const s01 = Math.max(0, Math.min(1, hi) - Math.max(0, lo));
        const s12 = Math.max(0, Math.min(2, hi) - Math.max(1, lo));
        dur = reduced ? 1 : Math.max(1, s01 * 1300 + s12 * 2500);
      }

      explore.addEventListener('click', (e) => { e.preventDefault(); go(2); });
      home.addEventListener('click', (e) => { e.preventDefault(); go(0); });
      railBtns.forEach((btn, i) => btn.addEventListener('click', () => go(i)));
      document.querySelectorAll('header a:not(#home)').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
      bar.addEventListener('submit', () => {
        barBtn.textContent = '✓';
        setTimeout(() => { barBtn.textContent = '→'; }, 1400);
      });

      let lockUntil = 0;
      addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) <= 8) return;
        const now = performance.now();
        if (now < lockUntil) return;
        const next = clamp(to + Math.sign(e.deltaY), 0, 2);
        if (next !== to) {
          lockUntil = now + 1400;
          go(next);
        }
      }, {passive: true});

      addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && to > 0) go(to - 1);
      });

      // Three.js scene
      const renderer = new THREE.WebGLRenderer({canvas: glCanvas, alpha: true, antialias: true});
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2e5, 2e5);

      const planet = new THREE.Group();
      const tilt = new THREE.Group();
      const spin = new THREE.Group();
      planet.add(tilt);
      tilt.add(spin);
      scene.add(planet);

      const sun = new THREE.Vector3(.62, .5, .6).normalize();
      const tharsisDir = dir(THARSIS.u, THARSIS.v);
      const siteDirs = SITES.map((s) => dir(s.u, s.v));

      const planetMat = new THREE.ShaderMaterial({
        uniforms: {
          map: {value: null},
          ready: {value: 0},
          texel: {value: new THREE.Vector2(1 / 2688, 1 / 1344)},
          sun: {value: sun},
          hiDir: {value: tharsisDir.clone()},
          hi: {value: 0},
          hiR: {value: .62}
        },
        vertexShader: `
          varying vec2 vUv; varying vec3 vObj; varying vec3 vN;
          void main(){ vUv = uv; vObj = normalize(position); vN = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }
        `,
        fragmentShader: `
          uniform sampler2D map; uniform vec2 texel; uniform vec3 sun, hiDir; uniform float hi, hiR, ready;
          varying vec2 vUv; varying vec3 vObj; varying vec3 vN;
          float luma(vec2 u){ return dot(texture2D(map, u).rgb, vec3(.3,.6,.1)); }
          void main(){
            vec3 col = texture2D(map, vUv).rgb; col = pow(col, vec3(2.6)) * vec3(1.18,.74,.56);
            // relief from the map's own brightness
            vec3 n = normalize(vN);
            vec3 t = normalize(cross(vec3(0.,1.,0.), n)), b = cross(n, t);
            float dx = luma(vUv + vec2(texel.x*2.,0.)) - luma(vUv - vec2(texel.x*2.,0.));
            float dy = luma(vUv + vec2(0.,texel.y*2.)) - luma(vUv - vec2(0.,texel.y*2.));
            n = normalize(n - (t*dx + b*dy) * 1.9);
            float diff = max(dot(n, sun), 0.);
            vec3 lit = col * (vec3(1.5,1.32,1.18) * pow(diff, .85) + vec3(.2,.09,.06));
            // highlighted region with a rough edge, like a territory on a map
            float d = acos(clamp(dot(normalize(vObj), hiDir), -1., 1.)) + (luma(vUv) - .45) * .22;
            float m = smoothstep(hiR, hiR - .03, d), edge = smoothstep(.03, .0, abs(d - hiR + .01));
            lit = mix(lit, mix(lit, vec3(.62,.012,.07) * (.25 + diff * 1.05) * (.5 + luma(vUv) * 1.1), .9), m * hi) + vec3(1.,.42,.4) * edge * hi * .22;
            float fres = pow(1. - max(vN.z, 0.), 3.2);
            lit += vec3(1.,.5,.26) * fres * (.05 + diff * .5);
            lit = lit / (lit * .3 + 1.) * 1.3;
            gl_FragColor = vec4(pow(lit, vec3(1./2.2)), 1.) * ready;
          }
        `
      });

      const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), planetMat);
      spin.add(planetMesh);

      const atmoMat = new THREE.ShaderMaterial({
        uniforms: {
          sun: {value: sun},
          ready: {value: 0}
        },
        vertexShader: `varying vec3 vN; void main(){ vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
        fragmentShader: `uniform vec3 sun; uniform float ready; varying vec3 vN;
          void main(){ float z = clamp(-vN.z, 0., 1.), a = smoothstep(.0, .55, z);
            float s = .55 + .6 * max(dot(-vN * vec3(1.,1.,0.), normalize(sun * vec3(1.,1.,0.))), 0.);
            a = pow(a, 2.6) * s * .7; gl_FragColor = vec4(vec3(1.,.64,.36), a * ready); }`,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });
      const atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(1.14, 64, 48), atmoMat);
      planet.add(atmoMesh);

      glCanvas.addEventListener('webglcontextlost', (e) => e.preventDefault());

      // Load and stitch Mars equirectangular map
      let loaded = false;
      let loadT = 0;

      function applyMapCanvas(canvas) {
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.NoColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.needsUpdate = true;
        planetMat.uniforms.map.value = tex;
        planetMat.uniforms.ready.value = 1;
        atmoMat.uniforms.ready.value = 1;
        loaded = true;
        loadT = performance.now();
      }

      const mapImg = new Image();
      mapImg.crossOrigin = 'anonymous';
      mapImg.onload = () => {
        const MW = 2688, MH = 1344;
        const c = document.createElement('canvas');
        c.width = MW;
        c.height = MH;
        const ctx = c.getContext('2d');
        ctx.drawImage(mapImg, 0, 0, MW, MH);

        // Fix horizontal seam: copy left 7%, mask transparent->opaque, draw at right edge
        const fw = Math.round(MW * .07);
        const tmp = document.createElement('canvas');
        tmp.width = fw;
        tmp.height = MH;
        const tctx = tmp.getContext('2d');
        tctx.drawImage(c, 0, 0, fw, MH, 0, 0, fw, MH);
        tctx.globalCompositeOperation = 'destination-in';
        const hg = tctx.createLinearGradient(0, 0, fw, 0);
        hg.addColorStop(0, 'rgba(0,0,0,0)');
        hg.addColorStop(1, 'rgba(0,0,0,1)');
        tctx.fillStyle = hg;
        tctx.fillRect(0, 0, fw, MH);
        ctx.drawImage(tmp, MW - fw, 0);

        // Pinch top and bottom 3.5% poles cleanly
        const ph = Math.round(MH * .035);
        const tg = ctx.createLinearGradient(0, 0, 0, ph);
        tg.addColorStop(0, '#e9dfd2');
        tg.addColorStop(1, 'rgba(233,223,210,0)');
        ctx.fillStyle = tg;
        ctx.fillRect(0, 0, MW, ph);

        const bg = ctx.createLinearGradient(0, MH, 0, MH - ph);
        bg.addColorStop(0, '#e9dfd2');
        bg.addColorStop(1, 'rgba(233,223,210,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, MH - ph, MW, ph);

        applyMapCanvas(c);
      };
      mapImg.onerror = () => {
        // Fallback procedural Mars texture if CDN fails
        const MW = 512, MH = 256;
        const c = document.createElement('canvas');
        c.width = MW; c.height = MH;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#b9552a';
        ctx.fillRect(0, 0, MW, MH);
        applyMapCanvas(c);
      };
      mapImg.src = MAP;

      // Dust 2D canvas
      const dctx = dustCanvas.getContext('2d');
      const sprite = document.createElement('canvas');
      sprite.width = 64;
      sprite.height = 64;
      const sctx = sprite.getContext('2d');
      const sg = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      sg.addColorStop(0, 'rgba(255,214,170,.95)');
      sg.addColorStop(.4, 'rgba(255,180,120,.42)');
      sg.addColorStop(1, 'rgba(255,180,120,0)');
      sctx.fillStyle = sg;
      sctx.fillRect(0, 0, 64, 64);

      let seed = 1337;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const motes = Array.from({length: 34}, () => {
        const u = rnd();
        return {
          x: rnd(),
          y: rnd(),
          r: 3 + u * u * 34,
          s: .004 + rnd() * .012,
          p: rnd() * 6.28
        };
      });

      // Layout & sizing
      let W = innerWidth, H = innerHeight, portrait = false, R0 = 200;
      let wordW = 0, wordH = 0, dustDpr = 1;

      function measureWord() {
        wordW = word0.offsetWidth;
        wordH = word0.offsetHeight;
      }

      function resize() {
        W = innerWidth;
        H = innerHeight;
        portrait = H > W * 1.05;
        R0 = portrait ? W * .36 : Math.min(H * .3, W * .19);

        camera.left = -W / 2;
        camera.right = W / 2;
        camera.top = H / 2;
        camera.bottom = -H / 2;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(W, H, false);

        dustDpr = Math.min(devicePixelRatio, 1.5);
        dustCanvas.width = Math.round(W * dustDpr);
        dustCanvas.height = Math.round(H * dustDpr);
        dctx.setTransform(dustDpr, 0, 0, dustDpr, 0, 0);

        measureWord();
        alignCard(cur);
      }

      addEventListener('resize', resize);
      document.fonts?.ready.then(() => { measureWord(); alignCard(cur); });
      pick(0);
      resize();

      // Pointer / drag state
      let yaw = faceYaw(dir(.4, .5)), pitch = .16, vy = 0, lastDragT = -1e9;
      let drag = null;
      let mouseX = 0, mouseY = 0;
      let curCx = W * .5, curCy = H * .5, curR = R0 * .03;

      addEventListener('pointermove', (e) => {
        mouseX = e.clientX / W - .5;
        mouseY = e.clientY / H - .5;
      }, {passive: true});

      glCanvas.addEventListener('pointerdown', (e) => {
        glCanvas.setPointerCapture(e.pointerId);
        drag = {
          id: e.pointerId,
          lx: e.clientX,
          ly: e.clientY,
          dist: 0,
          lastMove: performance.now()
        };
        vy = 0;
        lastDragT = performance.now();
        glCanvas.classList.add('drag');
      });

      glCanvas.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.lx;
        const dy = e.clientY - drag.ly;
        drag.dist += Math.hypot(dx, dy);
        drag.lx = e.clientX;
        drag.ly = e.clientY;
        const k = 1.1 / R0;
        yaw += dx * k;
        pitch = clamp(pitch + dy * k, -1, 1);
        vy = dx * k;
        const now = performance.now();
        drag.lastMove = now;
        lastDragT = now;
      });

      function endDrag(e) {
        if (!drag || e.pointerId !== drag.id) return;
        glCanvas.classList.remove('drag');
        const now = performance.now();
        if (now - drag.lastMove > 80) vy = 0;
        if (e.type === 'pointerup' && drag.dist < 6 && to < 2) {
          if (Math.hypot(e.clientX - curCx, e.clientY - curCy) <= curR) {
            go(to + 1);
          }
        }
        drag = null;
      }
      glCanvas.addEventListener('pointerup', endDrag);
      glCanvas.addEventListener('pointercancel', endDrag);

      // Reusable projection vector for #pin
      const pinVec = new THREE.Vector3();
      const yAxis = new THREE.Vector3(0, 1, 0);
      const xAxis = new THREE.Vector3(1, 0, 0);
      let prevNow = performance.now();

      function render(now) {
        const dt = Math.min((now - prevNow) / 1000, .05);
        prevNow = now;
        const t = now / 1000;
        const f = (r) => 1 - Math.exp(-dt * r);

        // State progression
        if (dur > 0) {
          const p = seg(now, t0, t0 + dur);
          st = mix(from, to, io(p));
          if (p >= 1) { st = to; dur = 0; }
        } else {
          st = to;
        }
        const a = clamp(st);
        const b = clamp(st - 1);

        // Intro
        const age = loaded ? (now - loadT) / 1000 : 0;
        const grow = out(seg(age, 0, 1.5));
        const iw = out(seg(age, .75, 1.7));

        // Planet
        const bz = io(seg(b, 0, .62));
        const px = portrait ? .5 * W : mix(.5 * W, .36 * W, a);
        const py = portrait ? mix(.4 * H, .33 * H, a) : .5 * H;
        const R = R0 * mix(.03, 1, grow) * (1 + a * .04) * Math.exp(bz * 2.5);
        const cx = mix(px, .5 * W, bz);
        const cy = mix(py, .5 * H, bz);
        curCx = cx; curCy = cy; curR = R;

        planet.position.set(cx - W / 2, H / 2 - cy, 0);
        planet.scale.setScalar(R);

        // Rotation
        if (st < .02) {
          if (!drag) {
            if (now - lastDragT > 1500) {
              yaw += dt * (.08 + (1 - grow) * 2.4);
            }
            yaw += vy;
            vy *= Math.exp(-dt * 4);
            pitch += (.16 - pitch) * f(1.2);
          }
        } else {
          const targetDir = b > 0 ? siteDirs[cur] : tharsisDir;
          const ty = faceYaw(targetDir);
          const tp = faceLat(targetDir);
          const dyaw = ((ty - yaw) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
          yaw += dyaw * f(3.6);
          pitch += (tp - pitch) * f(3.6);
          vy = 0;
        }
        tilt.rotation.x = pitch;
        spin.rotation.y = yaw;

        // Highlight uniforms
        const hiTarget = b > .02 ? siteDirs[cur] : tharsisDir;
        planetMat.uniforms.hiDir.value.copy(hiTarget);
        planetMat.uniforms.hiR.value = b > .02 ? mix(.62, .3, seg(b, 0, .1)) : .62;
        planetMat.uniforms.hi.value = clamp(seg(a, .15, .6) + (b > 0 ? 1 : 0));

        // word0 & eyebrow
        const w0x = portrait ? 0 : -a * .08 * W;
        const w0y = portrait ? (H * -.1 + R * 1.08 + wordH * .5) : (mouseY * -6);
        const I = (1 - iw) * 50;
        word0.style.transform = `translate(calc(-50% + ${w0x}px), calc(-50% + ${w0y}px))`;
        word0.style.clipPath = `inset(-10% ${I}% -10% ${I}%)`;
        word0.style.opacity = String(1 - seg(a, .1, .5));

        if (portrait) {
          eyebrow.style.transform = `translate(calc(-50% + ${w0x}px), calc(-50% + ${w0y + wordH * .5 + 24}px))`;
        } else {
          const ex = w0x - wordW * .5 + wordW * .02;
          const ey = w0y - (wordH * .5 + 34);
          eyebrow.style.transform = `translate(${ex}px, calc(-50% + ${ey}px))`;
        }
        eyebrow.style.opacity = String(iw * (1 - seg(a, .05, .35)));

        // flare
        flare.style.transform = `translate(${cx + R * .74}px, ${cy - R * .62}px)`;
        flare.style.opacity = String(grow * (.88 + .12 * Math.sin(t * 1.3)) * (1 - seg(bz, 0, .35)));

        // hint
        hint.style.opacity = String(iw * .8 * (1 - seg(a, 0, .25)));

        // pin (project Tharsis: dir rotated by spin then tilt)
        pinVec.copy(tharsisDir).applyAxisAngle(yAxis, yaw).applyAxisAngle(xAxis, pitch);
        pin.style.transform = `translate(${cx + pinVec.x * R - 6}px, ${cy - pinVec.y * R - 8}px)`;
        pin.style.opacity = String(seg(pinVec.z, .22, .42) * seg(age, 1.6, 2.1) * (1 - seg(a, 0, .3)));

        // word1
        const ka = seg(a, .45, 1);
        const w1x = portrait ? 0 : .02 * W + (1 - out(ka)) * 40;
        const w1y = portrait ? .46 * H : .56 * H;
        word1.style.transform = `translate(calc(-50% + ${w1x}px), ${w1y}px)`;
        word1.style.opacity = String(ka * (1 - seg(b, .02, .16)));

        // sites + card
        const sOp = seg(a, .55, 1) * (1 - seg(b, 0, .14));
        const sVis = sOp > .005 ? 'visible' : 'hidden';
        const sPe = sOp >= .6 ? 'auto' : 'none';
        sitesEl.style.opacity = String(sOp);
        sitesEl.style.visibility = sVis;
        sitesEl.style.pointerEvents = sPe;
        card.style.opacity = String(sOp);
        card.style.visibility = sVis;
        card.style.pointerEvents = sPe;
        card.style.transform = `translateX(${(1 - out(seg(a, .6, 1))) * 26}px)`;

        // #gl pointer events
        glCanvas.style.pointerEvents = st < 1.02 ? 'auto' : 'none';

        // region
        region.style.opacity = String(seg(b, .14, .26) * (1 - seg(b, .42, .52)));

        // fog
        const fi = seg(b, .36, .54);
        const fo = seg(b, .62, .96);
        const fogOp = fi * (1 - fo);
        fog.style.opacity = String(fogOp);
        fog.style.visibility = fogOp > .005 ? 'visible' : 'hidden';

        // landing layers
        const landVis = b > .5 ? 'visible' : 'hidden';
        land.style.visibility = landVis;
        fore.style.visibility = landVis;
        dest.style.visibility = landVis;
        if (b > .5) {
          const lk = out(seg(b, .5, 1));
          const fk = out(seg(b, .58, 1));
          const dk = out(seg(b, .66, .98));
          const drift = 1 + .02 * Math.sin(t * .18);
          land.style.transform = `translate(${mouseX * -14}px, ${mix(.2 * H, mouseY * -8, lk)}px) scale(${mix(1.3, 1.05, lk) * drift})`;
          fore.style.transform = `translate(${mouseX * -46}px, ${mix(.42 * H, 0, fk)}px) scale(1.06)`;
          dest.style.transform = `translate(${mouseX * -26}px, ${mix(.62 * H, (portrait ? .3 : .27) * H, dk)}px)`;
          destSmall.style.opacity = String(seg(b, .8, 1) * .92);
        } else {
          destSmall.style.opacity = '0';
        }

        // bar
        const bk = seg(b, .86, 1);
        bar.style.opacity = String(bk);
        bar.style.visibility = bk > .005 ? 'visible' : 'hidden';
        bar.style.pointerEvents = bk >= .6 ? 'auto' : 'none';
        bar.style.transform = `translate(-50%, ${(1 - out(bk)) * 34}px)`;

        // scrim
        scrim.style.opacity = String(seg(b, .6, .9));

        // rail
        const rIdx = Math.round(st);
        railBtns.forEach((btn, idx) => btn.classList.toggle('on', idx === rIdx));

        // dust canvas
        dctx.clearRect(0, 0, W, H);
        const dustScale = mix(1, .7, seg(b, .5, .8));
        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          const mx = ((m.x + t * m.s + 2) % 1.1 - .05) * W;
          const my = (m.y + Math.sin(t * .3 + m.p) * .02) * H;
          const s = Math.sin(t * .7 + m.p);
          dctx.globalAlpha = (.3 + .35 * s * s) * dustScale;
          dctx.drawImage(sprite, mx - m.r, my - m.r, m.r * 2, m.r * 2);
        }
        dctx.globalAlpha = 1;

        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }

      render(performance.now());
    </script>
  </body>
</html>
